<meta charset="UTF-8">

<title>텔레스트레이션 진행 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #7b7686;
    --line: #ece3d6;
    --accent: #ff6b4a;
    --accent-soft: #ffe3da;
    --blue: #3d6bff;
    --blue-soft: #e2e9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  body.flash { animation: flash 0.5s 4; }
  @keyframes flash { 50% { background: var(--accent); } }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 28px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 0 var(--line);
  }
  .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: #fffdf9;
    color: var(--ink);
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    font: inherit;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.blue { background: var(--blue); }
  button.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .mt { margin-top: 12px; }
  .or { text-align: center; color: var(--muted); font-size: 13px; margin: 16px 0; }
  .players { list-style: none; padding: 0; margin: 0; }
  .players li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px dashed var(--line);
  }
  .players li:last-child { border-bottom: none; }
  .players li.off { opacity: 0.45; }
  .dot {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px; color: #fff; background: var(--blue);
    flex: none;
  }
  .tag {
    font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .tag.me { background: var(--blue-soft); color: var(--blue); }
  .code {
    font-family: "Jua", sans-serif; font-size: 40px; letter-spacing: 6px;
    text-align: center; margin: 4px 0 10px;
  }
  .link-box { font-size: 13px; color: var(--muted); text-align: center; padding: 10px; }
  .err { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .round { font-family: "Jua", sans-serif; font-size: 18px; color: var(--muted); }
  .task { font-family: "Jua", sans-serif; font-size: 30px; margin: 6px 0; }
  .task.draw { color: var(--accent); }
  .task.guess { color: var(--blue); }
  .word-box {
    margin-top: 10px; padding: 14px; border-radius: 14px;
    background: var(--accent-soft); text-align: center;
  }
  .word { font-family: "Jua", sans-serif; font-size: 34px; letter-spacing: 1px; cursor: pointer; }
  .timer {
    font-family: "Jua", sans-serif;
    font-size: 84px; text-align: center; line-height: 1; margin: 6px 0 10px;
    font-variant-numeric: tabular-nums;
  }
  .timer.low { color: var(--accent); }
  .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width 0.2s linear; }
  .status { text-align: center; color: var(--muted); font-size: 14px; margin-top: 8px; }
  .notice {
    font-size: 13px; padding: 10px 12px; border-radius: 12px;
    background: #fff4d6; color: #7a5b00; margin-bottom: 14px;
  }
</style>
</head>

<div class="wrap">

// ======= Small storage helpers (may be blocked, so always try/catch) =======
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// ======= Identity =======
// clientId survives reloads, so a player who reconnects keeps their seat

// ======= Helpers =======
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newCode() {
  return String(Math.floor(Math.random() * 10000)).padStart(4, "0");
}

function shareLink() {
  return location.origin + location.pathname + "?room=" + roomCode;
}

function remainingMs() {
  if (state.phase === "running") return Math.max(0, localEndsAt - Date.now());
  if (state.phase === "paused" || state.phase === "ready") return state.remaining || 0;
  return 0;
}

function fmt(ms) {
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// ======= Alarm sound / flash / vibrate =======
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}

function alarm() {
  if (audioCtx) {
    const t = audioCtx.currentTime;
    for (let i = 0; i < 4; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = i % 2 ? 660 : 880;
      gain.gain.setValueAtTime(0.0001, t + i * 0.3);
      gain.gain.exponentialRampToValueAtTime(0.25, t + i * 0.3 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.3 + 0.25);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + i * 0.3);
      osc.stop(t + i * 0.3 + 0.28);
    }
  }
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
  document.body.classList.remove("flash");
  void document.body.offsetWidth;
  document.body.classList.add("flash");
  setTimeout(() => document.body.classList.remove("flash"), 2200);
}

// =====================================================================
// ======= CONNECTION (MQTT relay over secure WebSocket) =======
// =====================================================================
// All messages go through a public relay server, so it works across
// different networks (Wi-Fi, LTE, company networks) without P2P tricks.

function topic(name) { return TOPIC_ROOT + roomCode + "/" + name; }

function pub(name, obj, opts) {
  if (client && client.connected) client.publish(topic(name), JSON.stringify(obj), opts || { qos: 0 });
}

function ensureClient(will) {
  return new Promise(resolve => {
    if (client) {
      if (client.connected) resolve();
      else client.once("connect", () => resolve());
      return;
    }
    const opts = {
      clientId: "tele_" + myCid + "_" + Math.random().toString(36).slice(2, 6),
      clean: true,
      reconnectPeriod: 2000,
      connectTimeout: 8000,
      keepalive: 20
    };
    if (will) opts.will = will;
    client = mqtt.connect(BROKER, opts);
    const slow = setTimeout(() => {
      if (!client.connected) { notice = "연결 서버에 접속하는 중이에요… 인터넷 연결을 확인해 주세요."; render(); }
    }, 6000);
    client.on("connect", () => {
      clearTimeout(slow);
      if (notice.indexOf("연결") === 0 || notice.indexOf("인터넷") === 0) notice = "";
      resubscribe();
      resolve();
      render();
    });
    client.on("offline", () => { notice = "인터넷 연결이 불안정해요. 다시 연결하는 중…"; render(); });
    client.on("message", onMessage);
  });
}

// Subscriptions are lost on reconnect, so set them again every time
function resubscribe() {
  if (role === "host") client.subscribe([topic("hello"), topic("bye"), topic("reroll")]);
  if (role === "player") client.subscribe([topic("state/" + myCid), topic("host")]);
}

function onMessage(t, payload) {
  const prefix = TOPIC_ROOT + roomCode + "/";
  if (t.indexOf(prefix) !== 0) return;
  let msg = null;
  try { msg = payload.length ? JSON.parse(payload.toString()) : null; } catch (e) { return; }
  const name = t.slice(prefix.length);
  if (role === "host") onHostMsg(name, msg);
  if (role === "player") onPlayerMsg(name, msg);
}

// A room is busy if another host refreshed its marker recently
function roomBusy(code) {
  return new Promise(resolve => {
    const t = TOPIC_ROOT + code + "/host";
    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      client.removeListener("message", handler);
      client.unsubscribe(t);
      resolve(v);
    };
    const handler = (tp, payload) => {
      if (tp !== t) return;
      let m = null;
      try { m = JSON.parse(payload.toString()); } catch (e) {}
      finish(!!(m && m.cid !== myCid && Date.now() - m.at < HOST_STALE_MS));
    };
    client.on("message", handler);
    client.subscribe(t);
    setTimeout(() => finish(false), 1500);
  });
}

// ======= HOST SIDE =======

async function createRoom() {
  screen = "connecting";
  render();
  await ensureClient(null);
  for (let i = 0; i < 6; i++) {
    const code = newCode();
    if (!(await roomBusy(code))) { startHosting(code, null); return; }
  }
  notice = "방을 만들지 못했어요. 다시 시도해 주세요.";
  screen = "home";
  render();
}

async function startHosting(code, savedHost) {
  role = "host";
  roomCode = code;
  host = savedHost || { phase: "lobby" };
  screen = "connecting";
  render();
  await ensureClient(null);
  resubscribe();
  history.replaceState(null, "", "?room=" + code);
  screen = "game";
  hostSend();
}

function onHostMsg(name, msg) {
  if (!msg) return;
  const cid = String(msg.cid || "").slice(0, 20);
  if (!cid || cid === myCid) return;
  if (name === "hello") {
    const nm = String(msg.name || "").trim().slice(0, 12) || "이름없음";
    const known = conns[cid];
    const wasOnline = known && isOnline(cid);
    conns[cid] = { name: nm, lastSeen: Date.now() };
    // Reply right away to newcomers and returning players
    if (!wasOnline || known.name !== nm) hostSend();
  } else if (name === "reroll") {
    hostReroll(cid);
  } else if (name === "bye") {
    if (conns[cid]) { conns[cid].lastSeen = 0; hostSend(); }
  }
}

function isOnline(cid) {
  if (cid === myCid) return true;
  return !!conns[cid] && Date.now() - conns[cid].lastSeen < PLAYER_STALE_MS;
}

// Everyone currently connected, host first
function lobbyList() {
  const list = [{ peer: myCid, name: myName }];
  Object.keys(conns).forEach(cid => {
    if (isOnline(cid)) list.push({ peer: cid, name: conns[cid].name });
  });
  return list;
}

function onlineList() {
  return [myCid].concat(Object.keys(conns).filter(isOnline));
}

// Build the view one player is allowed to see (only their own word)
function viewFor(cid) {
  const s = Object.assign({}, host);
  delete s.endsAt;
  if (host.phase === "running") s.remaining = Math.max(0, host.endsAt - Date.now());
  // Each player only gets the word they draw in round 1
  if (host.firstWord) {
    s.myWord = host.firstWord[cid];
    s.canReroll = !host.rerolled[cid];
  }
  delete s.firstWord;
  delete s.rerolled;
  s.lobby = lobbyList();
  s.online = onlineList();
  return s;
}

function hostSend() {
  if (role !== "host" || !host) return;
  Object.keys(conns).forEach(cid => pub("state/" + cid, viewFor(cid)));
  pub("host", { cid: myCid, at: Date.now() }, { qos: 0, retain: true });
  save("tele-host", { code: roomCode, host: host });
  applyState(viewFor(myCid));
}

function hostStartGame() {
  const list = shuffle(lobbyList());
  if (list.length < 2) return;
  const n = list.length;
  // Even players draw their own word first (n rounds).
  // Odd players pass their word, so the next person draws it (n - 1 rounds).
  // Words are never revealed, so each player simply gets one word to draw.
  const odd = n % 2 === 1;
  const words = shuffle(WORDS);
  const firstWord = {};
  list.forEach((p, i) => { firstWord[p.peer] = words[i % words.length]; });
  host = {
    id: Math.random().toString(36).slice(2, 8),
    phase: "ready",
    round: 1,
    total: odd ? n - 1 : n,
    duration: duration,
    remaining: duration * 1000,
    players: list,
    firstWord: firstWord,
    rerolled: {},
    hostPeer: myCid
  };
  hostSend();
}

// Each player may swap their word once, before round 1 starts
function hostReroll(cid) {
  if (!host || host.phase !== "ready" || host.round !== 1) return;
  if (!host.firstWord || !host.firstWord[cid] || host.rerolled[cid]) return;
  const used = Object.values(host.firstWord);
  const pool = WORDS.filter(w => !used.includes(w));
  host.firstWord[cid] = pool[Math.floor(Math.random() * pool.length)];
  host.rerolled[cid] = true;
  hostSend();
}

function hostStartRound() {
  host.phase = "running";
  host.endsAt = Date.now() + host.remaining;
  hostSend();
}

function hostPause() {
  host.remaining = Math.max(0, host.endsAt - Date.now());
  host.phase = "paused";
  hostSend();
}

function hostEndRound() {
  host.remaining = 0;
  host.phase = host.round >= host.total ? "finished" : "roundEnd";
  hostSend();
}

function hostNextRound() {
  host.round += 1;
  host.phase = "ready";
  host.remaining = host.duration * 1000;
  hostSend();
}

function hostReset() {
  host = { phase: "lobby" };
  hostSend();
}

      notice = hostMarker && Date.now() - hostMarker.at < HOST_STALE_MS
        ? "방장에게 연결하는 중이에요…"
        : "방을 찾을 수 없어요. 방 번호를 확인하거나, 방장이 방을 열어 두었는지 확인해 주세요. 계속 기다리는 중…";
      render();
    }
  }, 4000);
}

function sayHello() {
  pub("hello", { cid: myCid, name: myName });
}

function onPlayerMsg(name, msg) {
  if (name === "host") { hostMarker = msg; return; }
  if (name === "state/" + myCid && msg) {
    screen = "game";
    notice = "";
    lastHostMsg = Date.now();
    applyState(msg);
  }
}

// Players say hello regularly so the host knows who is still here
setInterval(() => {
  if (role !== "player" || !client || !client.connected) return;
  sayHello();
  if (screen === "game" && Date.now() - lastHostMsg > 10000) {
    notice = "방장과 연결이 끊긴 것 같아요. 방장이 돌아오면 이어집니다.";
    render();
  }
}, 4000);

window.addEventListener("pagehide", () => {
  if (role === "player") pub("bye", { cid: myCid });
});

// =====================================================================
// ======= SHARED: state, timer, render =======
// =====================================================================

function applyState(s) {
  if (!s || typeof s !== "object") return;
  if (!s.canReroll) rerollPending = false;
  state = s;
  if (s.phase === "running") {
    localEndsAt = Date.now() + (s.remaining || 0);
    runningKey = s.id + "-" + s.round;
  }
  // Ring when a round we watched ends but our local timer missed it
  if ((s.phase === "roundEnd" || s.phase === "finished") && runningKey === s.id + "-" + s.round && alarmedKey !== runningKey) {
    alarmedKey = runningKey;
    alarm();
  }
  render();
}

// Tick: update timer, ring alarm, let host close the round
setInterval(() => {
  if (state.phase !== "running") return;
  const left = remainingMs();
  const key = state.id + "-" + state.round;
  if (left <= 0 && alarmedKey !== key) {
    alarmedKey = key;
    alarm();
  }
  if (left <= 0 && role === "host" && host && host.phase === "running") hostEndRound();
  updateTimer();
}, 200);

// Host re-sends full state so dropped messages recover
setInterval(() => { if (role === "host" && screen === "game") hostSend(); }, 3000);

let lastHtml = "";

function render() {
  const app = document.getElementById("app");
  document.getElementById("notice").innerHTML = notice ? '<div class="notice">' + esc(notice) + "</div>" : "";

  let html;
  if (screen === "home") html = homeView();
  else if (screen === "connecting") html = '<div class="card"><div class="status">연결하는 중… 📡</div></div>';
  else if (state.phase === "lobby" || !state.players) html = lobbyView();
  else if (state.phase === "finished") html = finishedView();
  else if (!state.players.some(p => p.peer === myCid)) html = spectatorView();
  else html = gameView();

  // Skip identical output so inputs keep focus and nothing flickers
  if (html === lastHtml) { updateTimer(); return; }
  lastHtml = html;

  // Keep focus and cursor in the field being typed in
  const active = document.activeElement;
  const focusId = active && active.id && app.contains(active) ? active.id : null;
  const sel = focusId && "selectionStart" in active ? [active.selectionStart, active.selectionEnd] : null;
  app.innerHTML = html;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {}
    }
  }
  bind();
  updateTimer();
}

// ======= Views =======
function homeView() {
  const joining = !!roomCode;
  const codeInput = `<input id="codeInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="방 번호 4자리" value="${esc(roomCode)}">`;
  return `
    <div class="card">
      <div class="label">닉네임</div>
      <input id="nameInput" maxlength="12" placeholder="예: 태히" value="${esc(myName)}">
      ${formError ? `<div class="err">${esc(formError)}</div>` : ""}
      ${joining ? `
        <div class="label mt">방 번호</div>
        ${codeInput}
        <button id="joinBtn" class="mt blue">참가하기</button>
      ` : `
        <button id="createBtn" class="mt">🏠 방 만들기 (방장)</button>
        <div class="or">또는 친구 방에 참가</div>
        ${codeInput}
        <button id="joinBtn" class="mt blue">참가하기</button>
      `}
      <div class="status">입장하면 알람 소리가 켜져요 🔔</div>
    </div>`;
}

function playerListHtml(list) {
  if (!list.length) return '<div class="status">아직 아무도 없어요</div>';
  const online = state.online || [];
  return '<ul class="players">' + list.map((p, i) => {
    const me = p.peer === myCid;
    const isHost = p.peer === (state.hostPeer || (role === "host" ? myCid : null)) || (state.phase === "lobby" && i === 0);
    const off = !online.includes(p.peer);
    return `<li class="${off ? "off" : ""}"><div class="dot">${i + 1}</div><div style="flex:1">${esc(p.name)}${off ? " (연결 끊김)" : ""}</div>
      ${me ? '<span class="tag me">나</span>' : ""}${isHost ? '<span class="tag">방장</span>' : ""}</li>`;
  }).join("") + "</ul>";
}

function lobbyView() {
  const list = state.lobby || [];
  let html = "";
  if (role === "host") {
    html += `
      <div class="card">
        <div class="label">친구에게 이 링크나 방 번호를 보내세요</div>
        <div class="code">${esc(roomCode)}</div>
        <input id="linkBox" class="link-box" readonly value="${esc(shareLink())}">
        <div class="row mt">
          <button id="copyBtn" class="ghost">🔗 링크 복사</button>
          ${navigator.share ? '<button id="shareBtn" class="ghost">📤 공유하기</button>' : ""}
        </div>
      </div>`;
  }
  html += `
    <div class="card">
      <div class="label">참가자 ${list.length}명</div>
      ${playerListHtml(list)}
    </div>`;
  if (role === "host") {
    html += `
      <div class="card">
        <div class="label">라운드 시간</div>
        <select id="durSel">
          ${[30, 45, 60, 90, 120].map(s => `<option value="${s}" ${s === duration ? "selected" : ""}>${s}초</option>`).join("")}
        </select>
        <button id="startGameBtn" class="mt" ${list.length < 2 ? "disabled" : ""}>게임 시작 (${list.length}명)</button>
        <div class="status">2명 이상이면 시작할 수 있어요 · 방장은 이 창을 닫지 마세요</div>
      </div>`;
  } else {
    html += '<div class="status">방장이 게임을 시작하기를 기다리는 중…</div>';
  }
  return html;
}

function myInfo() {
  return {
    r: state.round,
    n: state.total,
    word: state.myWord || "?",
    draw: state.round % 2 === 1
  };
}

function gameView() {
  const m = myInfo();
  let html = `
    <div class="card">
      <div class="round">라운드 ${m.r} / ${m.n}</div>
      <div class="task ${m.draw ? "draw" : "guess"}">${m.draw ? "✏️ 그리기" : "🤔 추측하기"}</div>
      ${m.r === 1 ? wordBoxHtml(m.word) : ""}
    </div>
    <div class="card">
      <div class="timer" id="timer">${fmt(remainingMs())}</div>
      <div class="bar"><div id="barFill" style="width:100%"></div></div>
      <div class="status">${phaseText()}</div>
    </div>`;
  html += hostControlsHtml();
  return html;
}

function wordBoxHtml(word) {
  let dice = "";
  if (state.phase === "ready" && state.round === 1) {
    dice = state.canReroll
      ? `<button id="rerollBtn" class="ghost small mt" ${rerollPending ? "disabled" : ""}>🎲 다시 뽑기 (1번)</button>`
      : '<div class="status">다시 뽑기를 사용했어요</div>';
  }
  return `
    <div class="word-box">
      <div class="label">그릴 단어</div>
      <div class="word">${esc(word || "?")}</div>
      ${dice}
    </div>`;
}

function phaseText() {
  if (state.phase === "ready") return "방장이 라운드를 시작하면 타이머가 돌아가요";
  if (state.phase === "running") return "진행 중!";
  if (state.phase === "paused") return "⏸ 일시정지";
  if (state.phase === "roundEnd") return "⏰ 시간 종료! 펜을 내려놓으세요";
  return "";
}

function hostControlsHtml() {
  if (role !== "host") return "";
  let btns = "";
  if (state.phase === "ready") btns = '<button id="hStart">▶ 라운드 시작</button>';
  if (state.phase === "running") btns = '<div class="row"><button id="hPause" class="ghost">⏸ 일시정지</button><button id="hEnd" class="ghost">⏭ 바로 종료</button></div>';
  if (state.phase === "paused") btns = '<div class="row"><button id="hStart">▶ 계속</button><button id="hEnd" class="ghost">⏭ 바로 종료</button></div>';
  if (state.phase === "roundEnd") btns = '<button id="hNext" class="blue">다음 라운드로</button>';
  return `
    <div class="card">
      <div class="label">방장 컨트롤</div>
      ${btns}
      <button id="hReset" class="ghost small mt">처음으로 (다시하기)</button>
    </div>`;
}

function spectatorView() {
  return `
    <div class="card">
      <div class="round">라운드 ${state.round} / ${state.total}</div>
      <div class="task">👀 관전 중</div>
      <div>이미 게임이 진행 중이에요. 다음 판에 함께해요!</div>
      <div class="timer mt" id="timer">${fmt(remainingMs())}</div>
      <div class="bar"><div id="barFill" style="width:100%"></div></div>
    </div>`;
}

function finishedView() {
  return `
    <div class="card" style="text-align:center">
      <div class="task draw">🎉 게임 끝!</div>
      <div>스케치북을 원래 주인 순서대로 한 장씩 공개해 보세요</div>
    </div>
    ${role === "host" ? '<div class="card"><button id="hReset">한 판 더 하기</button></div>' : ""}`;
}

function updateTimer() {
  const t = document.getElementById("timer");
  const bar = document.getElementById("barFill");
  if (!t) return;
  const left = remainingMs();
  t.textContent = fmt(left);
  t.classList.toggle("low", state.phase === "running" && left <= 10000);
  const total = (state.duration || 60) * 1000;
  if (bar) bar.style.width = (Math.max(0, Math.min(1, left / total)) * 100) + "%";
}

// ======= Event binding =======
function on(id, fn) {
  const el = document.getElementById(id);
  if (el) el.addEventListener("click", fn);
}

function readName() {
  const input = document.getElementById("nameInput");
  const name = input.value.trim().slice(0, 12);
  if (!name) {
    formError = "닉네임을 입력해 주세요";
    lastHtml = "";
    render();
    document.getElementById("nameInput").focus();
    return null;
  }
  formError = "";
  myName = name;
  save("tele-name", name);
  return name;
}

// Copy with the modern API, then fall back to the old select-and-copy way
function copyText(text) {
  const box = document.getElementById("linkBox");
  const fallback = () => {
    try {
      box.focus();
      box.select();
      box.setSelectionRange(0, text.length);
      return document.execCommand("copy");
    } catch (e) { return false; }
  };
  const report = ok => {
    const b = document.getElementById("copyBtn");
    if (b) b.textContent = ok ? "✅ 복사됐어요" : "길게 눌러 직접 복사해 주세요";
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => report(true)).catch(() => report(fallback()));
  } else {
    report(fallback());
  }
}

function bind() {
  on("createBtn", () => {
    if (!readName()) return;
    unlockAudio();
    createRoom();
  });
  on("joinBtn", () => {
    if (!readName()) return;
    const input = document.getElementById("codeInput");
    const code = input.value.replace(/\D/g, "");
    if (code.length !== 4) {
      formError = "방 번호 4자리를 입력해 주세요";
      lastHtml = "";
      render();
      document.getElementById("codeInput").focus();
      return;
    }
    unlockAudio();
    startJoining(code);
  });
  on("copyBtn", () => copyText(shareLink()));
  on("shareBtn", () => {
    navigator.share({ title: "텔레스트레이션", text: "방 번호 " + roomCode, url: shareLink() }).catch(() => {});
  });
  const lb = document.getElementById("linkBox");
  if (lb) lb.addEventListener("focus", () => lb.select());
  const ci = document.getElementById("codeInput");
  if (ci) ci.addEventListener("input", () => { ci.value = ci.value.replace(/\D/g, "").slice(0, 4); });

  const dur = document.getElementById("durSel");
  if (dur) dur.addEventListener("change", () => { duration = Number(dur.value); });

  on("rerollBtn", () => {
    rerollPending = true;
    lastHtml = "";
    render();
    if (role === "host") hostReroll(myCid);
    else pub("reroll", { cid: myCid });
    // Let the player try again if the message got lost
    setTimeout(() => { rerollPending = false; lastHtml = ""; render(); }, 4000);
  });
  on("startGameBtn", () => { unlockAudio(); hostStartGame(); });
  on("hStart", () => { unlockAudio(); hostStartRound(); });
  on("hPause", hostPause);
  on("hEnd", hostEndRound);
  on("hNext", hostNextRound);
  on("hReset", hostReset);
}

// ======= Startup =======
if (typeof mqtt === "undefined") {
  notice = "연결 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.";
}

// A host who reloads the page gets their room back
const savedHost = load("tele-host", null);
if (roomCode && savedHost && savedHost.code === roomCode && myName && typeof mqtt !== "undefined") {
  const h = savedHost.host || { phase: "lobby" };
  // The round clock cannot keep running across a reload, so pause it
  if (h.phase === "running") {
    h.phase = "paused";
    h.remaining = Math.max(0, (h.endsAt || 0) - Date.now());
    delete h.endsAt;
  }
  startHosting(roomCode, h);
} else {
  render();
}
</script>
